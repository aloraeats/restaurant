<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Alora Eat</title>
    <script>
        // Saves the intended path then redirects to index.html
        // index.html picks it up and restores it via history.replaceState
        var path = window.location.pathname +
                   window.location.search +
                   window.location.hash;
        var query = '?p=' + encodeURIComponent(path);
        window.location.replace('/' + query);
    </script>
</head>
<body></body>
</html>
